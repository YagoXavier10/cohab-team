<style>
  .tw { animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .8 } }
  .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
  .rise2 { animation: rise 1s .25s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

  .belt { animation: slide 8s linear infinite; }
  @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-1000px) } }
  .ring { transform-origin: 830px 130px; animation: pulse 3s ease-out infinite; }
  .ring2 { transform-origin: 830px 130px; animation: pulse 3s 1.5s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.4); opacity: .7 } to { transform: scale(1.6); opacity: 0 } }
</style>
